project:
  name: tomo
  data_dir: .bait-tomo

documentation:
  git_repos:
  - https://github.com/xray-imaging/2bm-docs.git
  local_folders: []

retriever:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  k: 3
  search_type: similarity
  score_threshold: null

embedding:
  provider: anl_argo  # 'huggingface' for local or 'anl_argo' for ANL Argo API
  api_key: ecodrea
  # model: 'sentence-transformers/all-MiniLM-L6-v2'  # For argo: 'ada002'. For huggingface: 'sentence-transformers/all-MiniLM-L6-v2'
  model: 'text-embedding-3-large'  # For argo: 'ada002'. For huggingface: 'sentence-transformers/all-MiniLM-L6-v2'
  device: cpu  # Device for local embeddings: 'cpu', 'cuda', 'mps', or 'auto'
  argo_base_url: https://apps-dev.inside.anl.gov/argoapi/v1

llm:
  provider: anl_argo
  api_key: ecodrea
  model: claudeopus46
  api_type: openai
  argo_base_url: https://apps-dev.inside.anl.gov/argoapi
  system_message: 'You are an expert on this project''s documentation. When answering
    questions: 1. Answer based *only* on the context from your ''query_documentation''
    tool 2. Provide concise but complete responses (2-3 paragraphs) 3. For "how to"
    questions, provide step-by-step numbered instructions 4. Include relevant source
    links from the context (documentation URLs, GitHub, PyPI, etc.) 5. If the context
    is insufficient, say so. Do not make up answers.'
text_processing:
  chunk_size: 1000
  chunk_overlap: 200
server:
  backend_host: 127.0.0.1
  backend_port: 8001
  frontend_host: 0.0.0.0
  frontend_port: 8000

bits:
  path: /Users/ecodrea/tomo-bits
  instrument_name: tomo_2bm
