project:
  name: tomo
  data_dir: .bait-tomo

documentation:
  git_repos:
  - https://github.com/xray-imaging/2bm-docs.git
  local_folders: []

retriever:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  k: 3
  search_type: similarity
  score_threshold: null

embedding:
  provider: anl_argo
  api_key: ecodrea
  model: 'text-embedding-3-large'
  device: cpu
  argo_base_url: https://apps-dev.inside.anl.gov/argoapi/v1

agents:
  router:
    model: claudeopus46
    api_type: anthropic
    api_key: ecodrea
    argo_base_url: https://apps.inside.anl.gov/argoapi/v1
    system_prompt: |
      You are a question classifier for a beamline instrument system.

      Classify the user's question into exactly one category:
      - "documentation": Questions about beamline documentation, experimental procedures,
        how-to guides, configuration, or general usage.
      - "device": Questions about ophyd devices, EPICS PVs, signals, motors, detectors,
        shutters, scan parameters, Bluesky plans, or hardware interaction.

      Respond with ONLY the category name, nothing else.
  doc_agent:
    model: claudeopus46
    api_type: anthropic
    api_key: ecodrea
    argo_base_url: https://apps.inside.anl.gov/argoapi/v1
    system_prompt: |
      You are an expert on this project's documentation. When answering questions:
      1. Answer based *only* on the context from your 'query_documentation' tool
      2. Provide concise but complete responses (2-3 paragraphs)
      3. For "how to" questions, provide step-by-step numbered instructions
      4. Include relevant source links from the context (documentation URLs, GitHub, PyPI, etc.)
      5. If the context is insufficient, say so. Do not make up answers.
  bits_agent:
    model: claudeopus46
    api_type: anthropic
    api_key: ecodrea
    argo_base_url: https://apps.inside.anl.gov/argoapi/v1
    system_prompt: |
      You are an expert on BITS (Beamline Instrument and Tool Suite) devices,
      ophyd signals, EPICS PVs, scan parameters, and Bluesky plans for this beamline.

      Answer questions about devices, their signals, PV names, scan configuration,
      and how to interact with hardware using ophyd and Bluesky.

      Base your answers on the device reference below. If the reference does not
      contain enough information, say so. Do not invent PV names or device attributes.

text_processing:
  chunk_size: 1000
  chunk_overlap: 200
server:
  backend_host: 127.0.0.1
  backend_port: 8001
  frontend_host: 0.0.0.0
  frontend_port: 8000

bits:
  path: /Users/ecodrea/tomo-bits
  instrument_name: tomo_2bm
